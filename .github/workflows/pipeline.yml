name: Harrit Pipeline

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create data directories
        run: mkdir -p data/PIB

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: data/PIB
          key: pipeline-state-${{ github.run_number }}
          restore-keys: |
            pipeline-state-

      - name: Restore utkarsh state
        uses: actions/cache@v4
        with:
          path: utkarsh_state.json
          key: utkarsh-state-${{ github.run_number }}
          restore-keys: |
            utkarsh-state-

      - name: Write pipeline config
        run: |
          python -c "
          import json, os
          config = {
            'telegram_bot_token': os.environ['TG_TOKEN'],
            'telegram_chat_id': os.environ['TG_CHAT'],
            'pib_database_path': os.path.join(os.getcwd(), 'data', 'PIB', 'pib_database.json'),
            'ca_database_path': os.path.join(os.getcwd(), 'data', 'PIB', 'current_affairs_database.json'),
            'dedup_store_path': os.path.join(os.getcwd(), 'data', 'PIB', 'sent_articles.json'),
            'log_path': os.path.join(os.getcwd(), 'data', 'PIB', 'pipeline.log'),
            're_scrape': False,
            'dry_run': False,
            'max_article_age_hours': 336,
            'dedup_days': 14,
            'max_articles_per_source': 0,
            'max_articles_total': 0,
            'telegram_retries': 5,
            'send_delay': 2.0,
            'description_chars': 400
          }
          with open('pipeline_config.json', 'w') as f: json.dump(config, f, indent=2)
          "
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run PIB scraper
        run: python pib_scraper.py
        continue-on-error: true

      - name: Run CA scraper
        run: python current_affairs_scraper.py
        continue-on-error: true

      - name: Run pipeline
        run: python run_pipeline.py

      - name: Run Utkarsh
        run: python utkarsh_youtube_ca.py
        continue-on-error: true
