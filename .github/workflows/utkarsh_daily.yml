name: Utkarsh Daily CA

on:
  schedule:
    - cron: '30 18 * * *'      # once daily at 18:30 UTC (adjust tz as needed)
  workflow_dispatch:           # allows manual "Run workflow" button

permissions:
  contents: write              # needed to persist utkarsh_state.json

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yt-dlp youtube-transcript-api deep-translator requests

      - name: Write pipeline config (from secrets)
        run: |
          cat > pipeline_config.json <<EOF
          {
            "telegram_bot_token": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
            "telegram_chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
            "pib_database_path": "pib_database.json",
            "ca_database_path": "ca_database.json",
            "dedup_store_path": "sent_articles.json",
            "log_path": "pipeline.log",
            "re_scrape": false,
            "dry_run": false,
            "max_article_age_hours": 336,
            "dedup_days": 14,
            "max_articles_per_source": 0,
            "max_articles_total": 0,
            "telegram_retries": 5,
            "send_delay": 2.0,
            "description_chars": 400
          }
          EOF

      - name: Run Utkarsh pipeline
        run: python utkarsh_youtube_ca.py

      - name: Persist per-day lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add utkarsh_state.json
          git commit -m "chore: update utkarsh state" || echo "no changes"
          git push || echo "push failed"
